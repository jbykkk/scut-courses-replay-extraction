name: Regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run regression checks
        env:
          CHECK_BASE_REF: ${{ github.base_ref }}
          CHECK_BEFORE_SHA: ${{ github.event.before }}
        run: uv run python scripts/check.py
