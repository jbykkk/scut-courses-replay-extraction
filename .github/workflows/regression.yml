name: Regression checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    # Match the operating system supported by the Playwright version in uv.lock.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Show test environment
        run: |
          cat /etc/os-release
          node --version
          uv --version
          uv run --locked python --version
          uv run --locked python -m playwright --version

      - name: Install test browser
        run: uv run --locked python -m playwright install --with-deps --only-shell chromium

      - name: Run regression checks
        env:
          CHECK_BASE_REF: ${{ github.base_ref }}
          CHECK_BEFORE_SHA: ${{ github.event.before }}
        run: uv run --locked python scripts/check.py
